<style>

}

  --accent:#7ea2ff; --accent-wash:#1d2742; --buy:#34c38f; --buy-wash:#13291f; --sell:#ff7a87; --sell-wash:#35181c; --warn:#e9a640; --warn-wash:#33260f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9e2f; --s7:#e66767; --s8:#8b9993; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);font-variant-numeric:tabular-nums;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding:0 max(16px, env(safe-area-inset-left, 0px))}

.slidehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

<script>
"use strict";
const clean = o => typeof o === 'string' ? o.replace(/\s*—\s*/g, ', ') : Array.isArray(o) ? o.map(clean) : (o && typeof o === 'object') ? Object.fromEntries(Object.entries(o).map(([k,v]) => [k, clean(v)])) : o;

const rs = x => 'Rs ' + Math.round(x).toLocaleString('en-IN');
const lakh = x => Math.abs(x) >= 1e7 ? 'Rs ' + (x/1e7).toFixed(2) + ' cr' : Math.abs(x) >= 1e5 ? 'Rs ' + (x/1e5).toFixed(2) + ' L' : rs(x);
const pc = (x,d=1) => x==null||isNaN(x) ? 'n/a' : (x*100).toFixed(d)+'%';
const spc = (x,d=1) => x==null||isNaN(x) ? 'n/a' : (x>=0?'+':'')+(x*100).toFixed(d)+'%';
const num = (x,d=0) => x==null||isNaN(x) ? 'n/a' : x.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const tip = $('#tip');
function showTip(ev, html){ tip.innerHTML=html; tip.style.display='block'; const w=tip.offsetWidth, h=tip.offsetHeight; let x=ev.clientX+14, y=ev.clientY+14; if (x+w>innerWidth-8) x=ev.clientX-w-14; if (y+h>innerHeight-8) y=ev.clientY-h-14; tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px'; }

function store(k, v){ try { if (v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k, JSON.stringify(v)); } catch(e) { return null; } return null; }

$('#asof').textContent = 'Prices to ' + D.asof;
if (D.example) $('#example').hidden = false;

/* ---------- formulas (KaTeX when online, readable text otherwise) ---------- */
const F = {
  R:{tex:'R = \\frac{P_{t-1}}{P_{t-12}} - 1', plain:'R = P(t-1) / P(t-12) - 1', say:'Return from twelve months ago to one month ago. Skipping the latest month avoids short-term reversals.'},
  sigma:{tex:'\\sigma = \\sqrt{\\tfrac{252}{N-1}\\sum (r_i-\\bar r)^2}', plain:'sigma = sqrt(252/(N-1) x sum of (r - mean r)^2)', say:'Yearly volatility of daily returns over the same window.'},
  M:{tex:'M = R / \\sigma', plain:'M = R / sigma', say:'Momentum per unit of risk. A calm, steady riser beats a wild one with the same return.'},
  z:{tex:'z = (M-\\mu_M)/\\sigma_M', plain:'z = (M - average M) / spread of M', say:'How far an asset sits above or below the rest of the list.'},
  regime:{tex:'\\text{risk on} \\iff P_t > \\mathrm{SMA}_{200}', plain:'risk on if price > 200-day average', say:'The trend test on the Nifty 50. Below its 200-day average, the engine leans toward shelter.'},
  rule:{tex:'\\Delta w = w^{*}-w,\\;\\text{trade if } |\\Delta w|\\ge\\theta', plain:'change = target weight - current weight; trade if |change| >= theta', say:'Small drifts are left alone because trading them costs more than it fixes.'}
};
let katexOk = false;
function tex(node){ const f=F[node.dataset.f]; if (katexOk) { try { window.katex.render(f.tex, node, {throwOnError:false}); return; } catch(e){} } node.textContent = f.plain; }
function texAll(){ document.querySelectorAll('[data-f]').forEach(tex); }
(function(){ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js'; s.onload=()=>{ katexOk=true; const st=document.createElement('style'); st.textContent='.katex{font:normal 1.1em KaTeX_Main,"Times New Roman",serif;line-height:1.2;white-space:nowrap}.katex .katex-mathml{position:absolute;clip:rect(1px,1px,1px,1px);padding:0;border:0;height:1px;width:1px;overflow:hidden}'; document.head.append(st); texAll(); }; document.head.append(s); })();

/* ---------- charts ---------- */
function lineChart(host, o){
  host.innerHTML=''; const W=Math.max(host.clientWidth||600, 300), H=o.height||300, m={l:56,r:16,t:16,b:30};
  const n=o.dates.length, X=i=>m.l+(W-m.l-m.r)*i/Math.max(n-1,1);
  let lo=Infinity, hi=-Infinity; o.series.forEach(s=>s.vals.forEach(v=>{ if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v); } }));
  const pad=(hi-lo)*.08||1; lo-=pad; hi+=pad; const Y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img','aria-label':o.label});
  for (let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, y=Y(v); svg.append(sv('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:css('--line')})); svg.append(sv('text',{x:m.l-8,y:y+4,'text-anchor':'end','font-size':12,fill:css('--muted')}, o.fmt(v))); }
  const months=new Set(); const every=o.every||(n>600?12:n>200?2:1); let lastX=-99;
  for (let i=0;i<n;i++){ const d=o.dates[i], k=d.slice(0,7); if (months.has(k)) continue; months.add(k); const mi=+d.slice(5,7)-1;
    if ((every>=12 ? mi===0 : mi%every===0) && i>2 && i<n-3 && X(i)-lastX>48){ lastX=X(i); svg.append(sv('text',{x:X(i),y:H-8,'text-anchor':'middle','font-size':12,fill:css('--muted')}, every>=12 ? d.slice(0,4) : new Date(d+'T00:00:00').toLocaleString('en-IN',{month:'short'})+(mi===0?' '+d.slice(2,4):''))); } }
  o.series.forEach(s=>{ let d=''; s.vals.forEach((v,i)=>{ if(v==null) return; d+=(i>0&&s.vals[i-1]!=null&&d?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); }); svg.append(sv('path',{d,fill:'none',stroke:s.color,'stroke-width':s.w||2,'stroke-dasharray':s.dash||null,'stroke-linejoin':'round','stroke-linecap':'round'})); });
  const cross=sv('line',{y1:m.t,y2:H-m.b,stroke:css('--faint'),'stroke-dasharray':'3 3',opacity:0}); svg.append(cross);
  const hit=sv('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'transparent'}); svg.append(hit);
  hit.addEventListener('pointermove',e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*W/r.width; const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/(W-m.l-m.r)*(n-1)))); cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('opacity',1);
    showTip(e, `<b>${o.dates[i]}</b><br>` + o.series.filter(s=>s.vals[i]!=null).map(s=>`${s.name}: ${o.fmt(s.vals[i])}`).join('<br>')); });
  hit.addEventListener('pointerleave',()=>{ cross.setAttribute('opacity',0); hideTip(); });
  (o.markers||[]).forEach(mk=>{ const g=sv('g',{tabindex:0,role:'button','aria-label':mk.label.replace(/<[^>]+>/g,' '),style:'cursor:pointer'}); g.append(sv('circle',{cx:X(mk.i),cy:Y(mk.y),r:12,fill:'transparent'}), sv('circle',{cx:X(mk.i),cy:Y(mk.y),r:mk.r||5.5,fill:mk.color,stroke:css('--surface'),'stroke-width':2}));
    g.addEventListener('pointermove',e=>{ e.stopPropagation(); showTip(e, mk.label); }); g.addEventListener('pointerleave',hideTip); g.addEventListener('click',()=>mk.click()); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); mk.click(); } }); svg.append(g); });
  if (o.endLabels) { const labs=o.series.map(s=>{ let i=n-1; while(i>0 && s.vals[i]==null) i--; return {s, i, y:Y(s.vals[i])-9}; }).sort((a,b)=>a.y-b.y);
    for (let k=1;k<labs.length;k++) if (labs[k].y-labs[k-1].y<15) labs[k].y=labs[k-1].y+15;
    labs.forEach(l=>svg.append(sv('text',{x:X(l.i)-4,y:l.y,'text-anchor':'end','font-size':12,'font-weight':600,fill:css('--ink')}, l.s.short||l.s.name))); }

}
function legend(items){ return el('div',{class:'pick',style:'gap:16px'}, items.map(i=>el('span',{class:'small muted',style:'display:inline-flex;gap:6px;align-items:center'}, el('span',{class:'key',style:`background:${i.color};${i.dash?'height:3px;width:16px;border-radius:0;':''}`}), i.name))); }

/* ---------- shared blotter math ---------- */
const P = D.rebalance_parameters;
let theta = store('theta') || P.theta_default;
function blotter(th){
  const nav=D.nav; const rows=D.execution_blotter.map(r=>{ const cw=r.cur_value/nav, tw=r.tgt_value/nav, drift=tw-cw; const trade=Math.abs(drift)>=th-1e-12 && Math.abs(drift)>1e-9; const side=trade?(drift>0?'BUY':'SELL'):'HOLD';
    let dv=0, dsh=0; if (trade){ if (side==='SELL' && r.tgt_value<=1){ dsh=-r.cur_shares; dv=-r.cur_value; } else { dsh=(drift>0?1:-1)*Math.floor(Math.abs(drift*nav)/r.price); dv=dsh*r.price; } }
    const cost=trade&&dsh!==0 ? r.cost_fixed + r.cost_pct*Math.abs(dv) : 0; const tax= side==='SELL' ? Math.abs(dv)*r.tax_rate_on_sale : 0;
    return Object.assign({}, r, {cw, tw, drift, side, dv, dsh, cost, tax}); });
  const vol=rows.reduce((a,r)=>a+Math.abs(r.dv),0);
  return {rows, vol, turnover:vol/2/nav, cost:rows.reduce((a,r)=>a+r.cost,0), tax:rows.reduce((a,r)=>a+r.tax,0), n:rows.filter(r=>r.side!=='HOLD').length};
}

/* ---------- tabs ---------- */
const redraw = {};
const TABS = [
  {id:'decision', name:'Should I rebalance?', build:buildDecision},
  {id:'plan', name:'The plan', build:buildPlan},

  {id:'record', name:'Track record', build:buildReplay},
  {id:'markets', name:'Explore markets', build:buildExplore},
  {id:'method', name:'How it decides', build:buildMethod},

const built = {};
const tablist = $('#tabs'), main = $('#main');
TABS.forEach((t,i)=>{
  const b=el('button',{role:'tab',type:'button',id:'tab-'+t.id,'aria-controls':'panel-'+t.id,'aria-selected':'false',tabindex:'-1',onclick:()=>show(t.id,true)}, t.name);

function show(id, push){
