<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio decision</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#14181f;--muted:#5b6575;--line:#e2e6ec;--accent:#2f5bd8;
  --ok:#17803d;--okbg:#e6f5ec;--warn:#9a5b00;--warnbg:#fff3dd;--bad:#b3261e;--badbg:#fdeceb;--info:#34506e;--infobg:#e9eff6;
  --c1:#2f5bd8;--c2:#d9822b;--c3:#17803d;--c4:#8a4fd1;--c5:#c4324b;--c6:#0e8a9a;--c7:#7a7f8c;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1318;--card:#171c23;--ink:#e8ecf2;--muted:#9aa5b5;--line:#2a313b;--accent:#7b9cff;
  --ok:#5ed38a;--okbg:#12301f;--warn:#f2b45a;--warnbg:#33260c;--bad:#ff8b82;--badbg:#3a1714;--info:#9ab8dc;--infobg:#1b2a3a;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{font-size:15px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14px;min-height:36px;display:inline-flex;align-items:center}
nav a:hover,nav a:focus-visible{background:var(--infobg);color:var(--ink)}
section{margin-top:28px;scroll-margin-top:70px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hero{padding:26px;border-width:2px}
.hero.REBALANCE{border-color:var(--accent)}
.hero.HOLD{border-color:var(--ok)}
.pill{display:inline-block;font-weight:700;letter-spacing:.04em;font-size:13px;padding:5px 12px;border-radius:999px}
.pill.REBALANCE{background:var(--accent);color:#fff}
.pill.HOLD{background:var(--ok);color:#fff}
.hero h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:12px 0 10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.kpi{background:var(--bg);border-radius:10px;padding:10px 14px;min-width:150px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font-size:20px}
ul.why{margin:8px 0 0;padding-left:20px}
ul.why li{margin:6px 0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.info{background:var(--infobg);color:var(--info)}
.fcard h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fcard p{margin:4px 0;font-size:14px}
details{margin-top:6px}
summary{cursor:pointer;color:var(--accent);font-size:14px;min-height:32px;display:flex;align-items:center}
details p{color:var(--muted);font-size:13px}
svg text{font-family:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;min-height:36px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--infobg);border-color:var(--accent);font-weight:600}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.legendnote{font-size:12px;color:var(--muted)}
#evdetail{min-height:120px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.steps input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--accent)}
.steps label{font-weight:600;cursor:pointer}
.steps .d{color:var(--muted);font-size:14px;margin-top:4px;white-space:pre-line}
.steps li.done label{text-decoration:line-through;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:.9em}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;z-index:20;max-width:260px;display:none}
iframe.tv{width:100%;height:340px;border:1px solid var(--line);border-radius:10px;margin-top:10px}
footer{margin-top:40px;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:12px 0}
</style>
</head>
<body>
<header><div class="in"><b>Portfolio decision</b><span class="legendnote" id="asof"></span>
<nav aria-label="Sections"><a href="#decision">Decision</a><a href="#money">Money</a><a href="#why">Why</a><a href="#backtest">Backtest</a><a href="#evidence">10 years</a><a href="#steps">Steps</a></nav></div></header>
<div class="wrap">
<section id="decision" aria-labelledby="h-decision"></section>
<section id="guards"></section>
<section id="money"></section>
<section id="why"></section>
<section id="backtest"></section>
<section id="evidence"></section>
<section id="steps"></section>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, ...k) => { const e = document.createElement(t); for (const [x,v] of Object.entries(a)) { if (x==='class') e.className=v; else if (x==='html') e.innerHTML=v; else if (x.startsWith('on')) e.addEventListener(x.slice(2), v); else e.setAttribute(x,v); } k.flat().forEach(c => e.append(c)); return e; };
const rs = x => 'Rs ' + Math.round(x).toLocaleString('en-IN');
const pc = (x, d=1) => (x==null||isNaN(x)) ? '-' : (x*100).toFixed(d) + '%';
const spc = (x, d=1) => (x==null||isNaN(x)) ? '-' : (x>=0?'+':'') + (x*100).toFixed(d) + '%';
const NS = 'http://www.w3.org/2000/svg';
const sv = (t, a={}, ...k) => { const e = document.createElementNS(NS, t); for (const [x,v] of Object.entries(a)) e.setAttribute(x, v); k.flat().forEach(c => e.append(c)); return e; };
const SLEEVE = {india_equity:'var(--c1)', global_equity:'var(--c4)', gold:'var(--c2)', commodity:'var(--c7)', bonds:'var(--c6)', cash:'var(--c3)', other:'var(--c7)'};
const SLEEVE_NAME = {india_equity:'India equity', global_equity:'Global equity', gold:'Gold', commodity:'Commodity', bonds:'Bonds', cash:'Cash', other:'Other'};
const PAL = ['var(--c7)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','#b8a400','#e0559c','#4b8b3b','#6a4c93','#2a9d8f','#e76f51','#264653','#8d99ae'];
const tip = $('#tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display='block'; const w=tip.offsetWidth; tip.style.left=Math.min(innerWidth-w-8, e.clientX+12)+'px'; tip.style.top=(e.clientY+14)+'px'; }
function hideTip() { tip.style.display='none'; }

$('#asof').textContent = 'as of ' + D.asof + ' · ' + D.data_note;

/* ---------------- 1. Decision (one answer first: Hick's law, Von Restorff) ---------------- */
(function(){
  const v = D.verdict, s = $('#decision');
  const hero = el('div', {class:'card hero '+v.call},
    el('span', {class:'pill '+v.call}, v.call === 'HOLD' ? 'DON\'T REBALANCE' : 'REBALANCE'),
    el('h1', {id:'h-decision'}, v.headline),
    el('div', {class:'kpis'},
      kpi('Portfolio', rs(D.nav)),
      kpi('Trades suggested', String(v.n_trades)),
      kpi('Fees + spread', rs(v.cost)),
      kpi('Tax this would trigger', rs(v.tax)),
      kpi('Total friction', pc(v.friction_pct, 2) + ' of portfolio')),
    el('b', {}, 'Why'),
    el('ul', {class:'why'}, v.reasons.map(r => el('li', {}, r))),
    el('p', {class:'legendnote'}, 'Strategy in use: ' + D.policy + '. Decision support only, not investment or tax advice. You make the final call.'),
    v.call === 'REBALANCE' ? el('a', {class:'btn primary', href:'#steps'}, 'Show me the steps') : el('a', {class:'btn', href:'#why'}, 'See what I checked'));
  s.append(hero);
  function kpi(a,b){ return el('div',{class:'kpi'}, el('small',{},a), el('b',{},b)); }
})();

/* ---------------- guardrails from profile ---------------- */
(function(){
  const s = $('#guards'); if (!D.guardrails.length) return;
  s.append(el('h2',{},'Your own limits'), el('p',{class:'sub'},'Checked across everything you own, including things this tool does not trade.'));
  const g = el('div',{class:'grid g3'});
  D.guardrails.forEach(x => g.append(el('div',{class:'card fcard'}, el('h3',{}, x.title, el('span',{class:'tag '+(x.level==='warn'?'warn':x.level==='ok'?'ok':'info')}, x.level==='warn'?'check':x.level==='ok'?'fine':'tip')), el('p',{class:'legendnote'}, x.detail))));
  s.append(g);
})();

/* ---------------- 2. Money movement (Sankey-like) ---------------- */
(function(){
  const s = $('#money');
  s.append(el('h2',{},'Where the money moves'), el('p',{class:'sub'},'Left is what you hold now, right is where the strategy wants it. Thick bands that stay level are untouched.'));
  const cur = D.current, tgt = D.target;
  const card = el('div',{class:'card'}); s.append(card);
  if (!cur.length) { card.append(el('p',{class:'empty'},'No holdings loaded yet.')); return; }
  const W=760, H=Math.max(300, Math.max(cur.length,tgt.length)*34+60), padT=20, gap=8, nodeW=16, lx=150, rx=W-150-nodeW;
  const total = Math.max(D.nav,1);
  const scale = (H-padT*2-gap*Math.max(cur.length,tgt.length)) / total;
  const svg = sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',role:'img','aria-label':'Money flow from current holdings to target holdings'});
  const place = (arr, x) => { let y=padT; const m={}; arr.forEach(n=>{ const h=Math.max(n.value*scale,3); m[n.symbol]={...n,y,h,x}; y+=h+gap; }); return m; };
  const L = place(cur, lx), R = place(tgt, rx);
  const syms = new Set([...Object.keys(L), ...Object.keys(R)]);
  const stay = {}, sells = {}, buys = {}; let buyTot = 0;
  syms.forEach(k => { const a=(L[k]||{value:0}).value, b=(R[k]||{value:0}).value; stay[k]=Math.min(a,b); sells[k]=Math.max(0,a-b); buys[k]=Math.max(0,b-a); buyTot+=buys[k]; });
  const offL = {}, offR = {}; syms.forEach(k => { offL[k]=0; offR[k]=0; });
  const band = (k1, k2, v, color, label) => {
    if (v*scale < 0.5) return;
    const a=L[k1], b=R[k2], h=v*scale;
    const y1=a.y+offL[k1], y2=b.y+offR[k2]; offL[k1]+=h; offR[k2]+=h;
    const x1=a.x+nodeW, x2=b.x, mx=(x1+x2)/2;
    const p = sv('path',{d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2} L${x2},${y2+h} C${mx},${y2+h} ${mx},${y1+h} ${x1},${y1+h} Z`, fill:color, opacity:k1===k2?.28:.5, tabindex:0});
    p.addEventListener('mousemove', e=>showTip(e,label)); p.addEventListener('mouseleave',hideTip); p.addEventListener('focus',()=>{const r=p.getBoundingClientRect(); showTip({clientX:r.x+r.width/2,clientY:r.y},label)}); p.addEventListener('blur',hideTip);
    svg.append(p);
  };
  syms.forEach(k => { if (L[k] && R[k]) band(k,k,stay[k],SLEEVE[L[k].sleeve]||'var(--c7)', `${k}: keep ${rs(stay[k])}`); });
  syms.forEach(k => { if (!L[k] || sells[k]<1) return; syms.forEach(j => { if (!R[j] || buys[j]<1 || buyTot<=0) return; const v = sells[k]*buys[j]/buyTot; band(k,j,v,'var(--c5)', `Move ${rs(v)} from ${k} to ${j}`); }); });
  const node = (n, side) => {
    const c = SLEEVE[n.sleeve]||'var(--c7)';
    svg.append(sv('rect',{x:n.x,y:n.y,width:nodeW,height:n.h,rx:3,fill:c}));
    const t = sv('text',{x: side==='L'? n.x-8 : n.x+nodeW+8, y:n.y+Math.min(n.h/2+4,16), 'text-anchor': side==='L'?'end':'start', fill:'var(--ink)', 'font-size':12});
    t.append(document.createTextNode(`${n.symbol} ${(n.value/total*100).toFixed(0)}%`));
    svg.append(t);
    if (n.h>30) { const t2=sv('text',{x:t.getAttribute('x'),y:n.y+Math.min(n.h/2+4,16)+14,'text-anchor':t.getAttribute('text-anchor'),fill:'var(--muted)','font-size':11}); t2.append(document.createTextNode(rs(n.value))); svg.append(t2); }
  };
  Object.values(L).forEach(n=>node(n,'L')); Object.values(R).forEach(n=>node(n,'R'));
  svg.append(Object.assign(sv('text',{x:lx+nodeW/2,y:12,'text-anchor':'middle','font-size':12,fill:'var(--muted)'}),{textContent:'Now'}), Object.assign(sv('text',{x:rx+nodeW/2,y:12,'text-anchor':'middle','font-size':12,fill:'var(--muted)'}),{textContent:'Target'}));
  card.append(svg);
  const leg = el('div',{class:'chips'}); [...new Set([...cur,...tgt].map(n=>n.sleeve))].forEach(sl => leg.append(el('span',{class:'legendnote'}, el('span',{class:'sw',style:'background:'+SLEEVE[sl]}), ' '+(SLEEVE_NAME[sl]||sl)+'  '))); leg.append(el('span',{class:'legendnote'}, el('span',{class:'sw',style:'background:var(--c5)'}),' money being moved'));
  card.append(leg);
  if (D.others.length) {
    const tot = D.others.reduce((a,o)=>a+o.value,0);
    card.append(el('p',{class:'legendnote'}, `Not shown, not traded: ${D.others.length} other investment(s) worth ${rs(tot)} (${D.others.map(o=>o.name).join(', ')}). They count in your limits above.`));
  }
  // trades table
  if (D.trades.length) {
    const rows = D.trades.filter(t => !/Re-buy/.test(t.why[0]||'') || true);
    const tb = el('table',{}, el('thead',{}, el('tr',{}, ['Trade','Value','Units','Fees','Tax now','Why'].map(h=>el('th',{},h)))), el('tbody',{}, rows.map(t => el('tr',{}, el('td',{}, el('span',{class:'tag '+(t.side==='sell'?'bad':'ok')}, t.side.toUpperCase()), ' '+t.symbol+' ', el('small',{class:'legendnote'}, t.kind.replace('_',' '))), el('td',{},rs(t.value)), el('td',{},t.qty.toLocaleString('en-IN')), el('td',{},rs(t.cost)), el('td',{},rs(t.tax_now)), el('td',{style:'text-align:left;white-space:normal;min-width:260px'}, (t.why||[]).slice(0,2).join(' ')))))); 
    card.append(el('div',{class:'scroll',style:'margin-top:10px'}, tb));
  }
})();

/* ---------------- 3. Why: what was considered ---------------- */
(function(){
  const s = $('#why');
  s.append(el('h2',{},'What the decision considered'), el('p',{class:'sub'},'Each card is one input. Green is fine, amber is worth a look, red pushes toward acting.'));
  const g = el('div',{class:'grid g3'});
  D.factors.forEach(f => g.append(el('div',{class:'card fcard'}, el('h3',{}, f.name, el('span',{class:'tag '+f.status}, {ok:'ok',warn:'watch',bad:'alert',info:'info'}[f.status])), el('p',{}, f.line), el('details',{}, el('summary',{},'Details'), el('p',{}, f.detail)))));
  s.append(g);
  if (D.policy_why && D.policy_why.length) s.append(el('div',{class:'card',style:'margin-top:12px'}, el('b',{},'How the strategy reached its target'), el('ul',{class:'why'}, D.policy_why.map(w=>el('li',{},w)))));
  if (D.holdings.length) s.append(el('div',{class:'card scroll',style:'margin-top:12px'}, el('b',{},'Your lots'), el('table',{}, el('thead',{}, el('tr',{}, ['Holding','Bought','Units','Cost','Value','Gain','Tax status'].map(h=>el('th',{},h)))), el('tbody',{}, D.holdings.map(h => el('tr',{}, el('td',{},h.symbol), el('td',{},h.buy_date), el('td',{},h.qty.toLocaleString('en-IN')), el('td',{},rs(h.cost)), el('td',{},rs(h.value)), el('td',{style:'color:var(--'+(h.gain>=0?'ok':'bad')+')'},rs(h.gain)), el('td',{},h.term)))))));
  if (D.notes.length) s.append(el('div',{class:'card',style:'margin-top:12px'}, el('b',{},'Also worth knowing'), el('ul',{class:'why'}, D.notes.map(n=>el('li',{},n)))));
})();

/* ---------------- line chart ---------------- */
function lineChart(host, o) {
  host.innerHTML='';
  const W=Math.max(host.clientWidth,320), H=o.height||340, m={l:56,r:12,t:12,b:26};
  const n=o.dates.length, xs=i=>m.l+(W-m.l-m.r)*i/(n-1);
  let lo=Infinity, hi=-Infinity; o.series.forEach(s=>s.vals.forEach(v=>{ if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);} }));
  const pad=(hi-lo)*.06||1; lo-=pad; hi+=pad;
  const ys=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img','aria-label':o.label||'chart'});
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, y=ys(v); svg.append(sv('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:'var(--line)'})); const t=sv('text',{x:m.l-6,y:y+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'}); t.textContent=o.fmt?o.fmt(v):Math.round(v); svg.append(t); }
  const seen=new Set(); for(let i=0;i<n;i++){ const d=o.dates[i], key=d.slice(0,7); if(d.slice(8,10)<'05' && !seen.has(key) && (o.every||3)>0 && (+d.slice(5,7)-1)%(o.every||3)===0){ seen.add(key); const t=sv('text',{x:xs(i),y:H-8,'text-anchor':'middle','font-size':11,fill:'var(--muted)'}); t.textContent=d.slice(0,7); svg.append(t);} }
  o.series.forEach(s=>{ let d=''; s.vals.forEach((v,i)=>{ if(v==null)return; d+=(d?'L':'M')+xs(i).toFixed(1)+','+ys(v).toFixed(1); }); svg.append(sv('path',{d,fill:'none',stroke:s.color,'stroke-width':s.w||2,'stroke-dasharray':s.dash||'', 'stroke-linejoin':'round'})); });
  const cross=sv('line',{y1:m.t,y2:H-m.b,stroke:'var(--muted)','stroke-dasharray':'3 3',opacity:0}); svg.append(cross);
  (o.markers||[]).forEach(mk=>{ const x=xs(mk.i), y=ys(mk.y); const c=sv('circle',{cx:x,cy:y,r:mk.r||6,fill:mk.color,stroke:'var(--card)','stroke-width':2,tabindex:0,role:'button','aria-label':mk.label,style:'cursor:pointer'});
    c.addEventListener('mousemove',e=>{e.stopPropagation();showTip(e,mk.label)}); c.addEventListener('mouseleave',hideTip); c.addEventListener('click',e=>{e.stopPropagation();mk.click()}); c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();mk.click()}}); svg.append(c); });
  const ov=sv('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'transparent'}); svg.insertBefore(ov, svg.children[svg.children.length-(o.markers||[]).length]);
  ov.addEventListener('mousemove',e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*W/r.width; const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/(W-m.l-m.r)*(n-1)))); cross.setAttribute('x1',xs(i)); cross.setAttribute('x2',xs(i)); cross.setAttribute('opacity',1);
    showTip(e,`<b>${o.dates[i]}</b><br>`+o.series.filter(s=>s.vals[i]!=null).map(s=>`<span style="color:${'#fff'}">●</span> ${s.name}: ${o.fmt?o.fmt(s.vals[i]):Math.round(s.vals[i])}`).join('<br>')); });
  ov.addEventListener('mouseleave',()=>{cross.setAttribute('opacity',0);hideTip();});
  host.append(svg); return {xs,ys,svg};
}

/* ---------------- 4. Backtest explorer ---------------- */
(function(){
  const s=$('#backtest'), B=D.backtest;
  s.append(el('h2',{},'Replay: what would each strategy have done?'), el('p',{class:'sub'},'Last 12 months using your lots, real prices, fees and Indian tax. Dots are the days the strategy moved money. Click a dot to see why and what the market was doing.'));
  if(!B){ s.append(el('div',{class:'card empty'},'Run `python main.py site` to include the backtest.')); return; }
  const names=Object.keys(B.series), base=names[0];
  let sel=new Set([base, B.active || names[0]]); let focus=B.active||names[0];
  const colorOf=n=>PAL[names.indexOf(n)%PAL.length];
  const card=el('div',{class:'card'}); s.append(card);
  const chips=el('div',{class:'chips',role:'group','aria-label':'Strategies to compare'}); card.append(chips);
  const host=el('div'); card.append(host);
  const fsel=el('select',{'aria-label':'Show moves for', style:'margin:8px 0;padding:8px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--line)'}); card.append(el('label',{class:'legendnote'},'Show the dots for: ',fsel));
  const detail=el('div',{id:'evdetail',class:'card',style:'margin-top:12px;background:var(--bg)'}); card.append(detail);
  const tbl=el('div',{class:'scroll',style:'margin-top:12px'}); card.append(tbl);
  names.forEach(n=>fsel.append(el('option',{value:n},n))); fsel.value=focus;
  fsel.addEventListener('change',()=>{focus=fsel.value; sel.add(focus); draw(); detail.innerHTML='<p class="empty">Click a dot on the chart.</p>';});
  function drawChips(){ chips.innerHTML=''; names.forEach(n=>chips.append(el('button',{class:'chip','aria-pressed':sel.has(n),type:'button',onclick:()=>{ if(sel.has(n)&&sel.size>1) sel.delete(n); else sel.add(n); draw(); }}, el('span',{class:'sw',style:'background:'+colorOf(n)}), n))); }
  function draw(){
    drawChips();
    const series=[...sel].map(n=>({name:n,color:colorOf(n),vals:B.series[n].map(v=>v/B.series[base][0]*100),w:n===base?2.5:1.8,dash:n===base?'5 4':''}));
    const idx=Object.fromEntries(B.dates.map((d,i)=>[d,i]));
    const markers=(B.events[focus]||[]).filter(e=>e.type!=='tax' && idx[e.date]!=null).map(e=>{ const i=idx[e.date]; return {i,y:B.series[focus][i]/B.series[base][0]*100,color:e.type==='sell'?'var(--bad)':'var(--ok)',label:`${e.date}: ${e.type.toUpperCase()} ${e.symbol} ${rs(e.value)}`,click:()=>showEvent(e)}; });
    const taxm=(B.events[focus]||[]).filter(e=>e.type==='tax'&&idx[e.date]!=null).map(e=>({i:idx[e.date],y:B.series[focus][idx[e.date]]/B.series[base][0]*100,color:'var(--warn)',r:5,label:e.date+': '+e.why,click:()=>showEvent(e)}));
    lineChart(host,{dates:B.dates,series,markers:[...markers,...taxm],fmt:v=>v.toFixed(1),label:'Portfolio value, start = 100',every:2});
    card.querySelector('.legendnote.k')?.remove();
    const note=el('p',{class:'legendnote k'}, 'Start = 100, after fees, with tax paid each financial year. Green dot = buy, red = sell, amber = tax paid. Dashed = doing nothing.');
    host.append(note);
    tbl.innerHTML=''; tbl.append(el('table',{},el('thead',{},el('tr',{},['Strategy','Return','After tax if sold','Worst fall','Tax paid','Fees','Turnover'].map(h=>el('th',{},h)))),el('tbody',{},B.summary.filter(r=>sel.has(r.name)).map(r=>el('tr',{},el('td',{},el('span',{class:'sw',style:'background:'+colorOf(r.name)}),' '+r.name),el('td',{},spc(r.ret)),el('td',{},spc(r.after_tax)),el('td',{},pc(r.mdd)),el('td',{},rs(r.taxes)),el('td',{},rs(r.costs)),el('td',{},r.turnover.toFixed(1)+'x'))))));
  }
  function showEvent(e){
    detail.innerHTML='';
    if(e.type==='tax'){ detail.append(el('b',{},e.date+' · tax paid'),el('p',{},e.why)); return; }
    detail.append(el('b',{},`${e.date} · ${e.type.toUpperCase()} ${e.symbol}`), el('p',{},`${e.pct}% of a Rs ${Math.round(e.value).toLocaleString('en-IN')} order at Rs ${e.price.toLocaleString('en-IN')} (${e.kind.replace('_',' ')}). ${e.why||''}`));
    const pd=B.px[e.symbol]; if(pd){ const i=B.px_dates.indexOf(e.date); if(i>=0){ const a=Math.max(0,i-60), b=Math.min(pd.length,i+61); const sl=pd.slice(a,b); const base0=sl.find(v=>v!=null)||1; const h=el('div',{style:'margin-top:8px'}); detail.append(el('span',{class:'legendnote'},`${e.symbol} price, 60 trading days either side (day of move marked)`),h);
      const mi=i-a; const r=lineChart(h,{dates:B.px_dates.slice(a,b),series:[{name:e.symbol,color:'var(--accent)',vals:sl.map(v=>v==null?null:v/base0*100)}],markers:[{i:mi,y:sl[mi]/base0*100,color:e.type==='sell'?'var(--bad)':'var(--ok)',label:e.type+' here',click:()=>{}}],height:170,fmt:v=>v.toFixed(0),every:1}); } }
    if(e.tv){ const btn=el('button',{class:'btn',type:'button',style:'margin-top:8px',onclick:()=>{ const f=el('iframe',{class:'tv',title:'Live chart for '+e.symbol,loading:'lazy',src:`https://s.tradingview.com/widgetembed/?symbol=${encodeURIComponent(e.tv)}&interval=D&theme=${matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}&style=1&hidesidetoolbar=1&withdateranges=1`}); btn.replaceWith(f); }},'Load live chart for '+e.symbol+' (TradingView)'); detail.append(btn); }
  }
  detail.innerHTML='<p class="empty">Click a dot on the chart to see what happened.</p>';
  draw(); addEventListener('resize',()=>draw());
})();

/* ---------------- 5. 10-year evidence ---------------- */
(function(){
  const s=$('#evidence'), V=D.validation;
  s.append(el('h2',{},'Does it hold up over 10 years?'));
  if(!V){ s.append(el('div',{class:'card empty'},'Run `python main.py validate` (about 10 minutes the first time) to add the long-history test.')); return; }
  s.append(el('p',{class:'sub'},`${V.start} to ${V.end}, starting from a lump sum in the Nifty 50 ETF. Each strategy is also tested in rolling ${V.window_years}-year windows, so one lucky stretch cannot flatter it.`));
  const card=el('div',{class:'card'}); s.append(card);
  const names=V.rows.map(r=>r.name); const dates=V.curves.dates; const base=V.curves.series[names[0]];
  const chips=el('div',{class:'chips'}); card.append(chips); const host=el('div'); card.append(host);
  let sel=new Set([names[0], D.backtest&&D.backtest.active? D.backtest.active : names[1]]);
  const color=n=>PAL[names.indexOf(n)%PAL.length];
  function draw(){ chips.innerHTML=''; names.forEach(n=>chips.append(el('button',{class:'chip','aria-pressed':sel.has(n),type:'button',onclick:()=>{ if(sel.has(n)&&sel.size>1) sel.delete(n); else sel.add(n); draw(); }},el('span',{class:'sw',style:'background:'+color(n)}),n)));
    lineChart(host,{dates,series:[...sel].map(n=>({name:n,color:color(n),vals:V.curves.series[n].map(v=>v/V.curves.series[n][0]*100),w:n===names[0]?2.5:1.8,dash:n===names[0]?'5 4':''})),fmt:v=>v.toFixed(0),label:'10-year value, start=100',every:12}); }
  draw(); addEventListener('resize',draw);
  const tone={'robust edge':'ok','promising, not proven':'info','cuts drawdown at little cost':'info','no reliable edge':'warn','baseline':'info'};
  card.append(el('div',{class:'scroll',style:'margin-top:12px'}, el('table',{},el('thead',{},el('tr',{},['Strategy','Yearly return after tax','Worst fall','Beat doing nothing in','Median gap / yr','Worst window','Verdict'].map(h=>el('th',{},h)))),
    el('tbody',{},V.rows.map(r=>el('tr',{},el('td',{},r.name),el('td',{},pc(r.cagr_after_tax)),el('td',{},pc(r.max_drawdown)),el('td',{},r.verdict==='baseline'?'-':pc(r.win_rate,0)+' of '+r.windows+' windows'),el('td',{},r.verdict==='baseline'?'-':spc(r.median_excess)),el('td',{},r.verdict==='baseline'?'-':spc(r.worst_excess)),el('td',{},el('span',{class:'tag '+(tone[r.verdict]||'info')},r.verdict))))))));
  card.append(el('p',{class:'legendnote'},'Gap = yearly return minus doing nothing, in the same window, after fees and Indian capital-gains tax. "Robust" needs wins in 60%+ of windows, a positive median in both the early and late half, and no window worse than -5 points a year. Today\'s tax rules are applied to all years. Strategies added after seeing results were chosen on this same history, so their numbers are optimistic.'));
})();

/* ---------------- 6. Steps (Zeigarnik: visible progress) ---------------- */
(function(){
  const s=$('#steps');
  s.append(el('h2',{},'Do it, step by step'), el('p',{class:'sub'},D.verdict.call==='HOLD'?'No trades are recommended. These are the steps you would follow if you decide to act anyway, or to keep your records current.':'Tick each step as you finish. Your progress is saved in this browser.'));
  const card=el('div',{class:'card'}); s.append(card);
  const key='steps-'+D.asof; let saved={}; try{ saved=JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){}
  const bar=el('div',{class:'bar'},el('i')); const cnt=el('p',{class:'legendnote'}); card.append(bar,cnt);
  const ol=el('ol',{class:'steps'}); card.append(ol);
  function upd(){ const n=D.steps.length, d=Object.values(saved).filter(Boolean).length; bar.firstChild.style.width=(d/n*100)+'%'; cnt.textContent=`${d} of ${n} done`; }
  D.steps.forEach((st,i)=>{ const id='st'+i; const cb=el('input',{type:'checkbox',id}); cb.checked=!!saved[i];
    const li=el('li',{class:saved[i]?'done':''},cb,el('div',{},el('label',{for:id},`${i+1}. ${st.title}`),el('div',{class:'d'},st.detail),
      st.cmd?el('div',{class:'d'},el('code',{},st.cmd)):'', (st.why&&st.why.length)?el('details',{},el('summary',{},'Why this trade'),el('p',{},st.why.join(' '))):''));
    cb.addEventListener('change',()=>{ saved[i]=cb.checked; li.classList.toggle('done',cb.checked); try{localStorage.setItem(key,JSON.stringify(saved));}catch(e){} upd(); });
    ol.append(li); });
  upd();
})();

$('#foot').innerHTML='Decision support only. Not investment, legal or tax advice; tax rules are modelled from the Finance Acts as understood at build time, so confirm with a CA. Past results, including the 10-year test, do not guarantee future returns. Built to follow common UX laws: one answer first (Hick), chunked cards (Miller), progress you can see (Zeigarnik), familiar patterns (Jakob), large tap targets (Fitts).';
