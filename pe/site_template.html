<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio decision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f8fafc;--panel:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--hover:#f1f5f9;
  --buy:#059669;--sell:#e11d48;--primary:#0f172a;--onprimary:#f8fafc;--warn:#b45309;--info:#475569;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono","JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--panel:#09090b;--ink:#fafafa;--muted:#a1a1aa;--line:#27272a;--hover:#18181b;--buy:#10b981;--sell:#fb7185;--primary:#fafafa;--onprimary:#09090b;--warn:#f59e0b;--info:#a1a1aa}}
*{box-sizing:border-box}
html{font-variant-numeric:tabular-nums}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
a{color:var(--ink)}
.n,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .in{max-width:1320px;margin:0 auto;padding:8px 12px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.brand{font:600 13px var(--mono);letter-spacing:.06em}
.asof{color:var(--muted);font:12px var(--mono)}
nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 10px;color:var(--muted);text-decoration:none;font-size:13px;min-height:32px;display:inline-flex;align-items:center;border-radius:4px}
nav a:hover,nav a:focus-visible{color:var(--ink);background:var(--hover)}
main{max-width:1320px;margin:0 auto;padding:12px}
.panel{border:1px solid var(--line);background:var(--panel);margin-bottom:12px;border-radius:4px}
.ph{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.ph h2{margin:0;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.ph .hint{color:var(--muted);font-size:12px}
.pb{padding:8px 12px}
.divide>*+*{border-top:1px solid var(--line)}
.cells{display:grid;grid-template-columns:2fr repeat(5,1fr)}
.cell{padding:8px 12px;border-left:1px solid var(--line)}
.cell:first-child{border-left:0}
.cell small{display:block;color:var(--muted);font:11px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.cell b{font:500 18px var(--mono)}
.cell .sub{color:var(--muted);font:12px var(--mono)}
.buy{color:var(--buy)}.sell{color:var(--sell)}.hold{color:var(--muted)}.warn{color:var(--warn)}
.tag{display:inline-block;font:600 11px var(--mono);padding:1px 6px;border:1px solid currentColor;border-radius:3px;letter-spacing:.04em}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
td.wrap{white-space:normal;min-width:220px;text-align:left}
tbody tr:hover{background:var(--hover)}
tr.open>td{background:var(--hover)}
.scroll{overflow-x:auto}
button{font:inherit;color:inherit}
.btn{min-height:32px;padding:0 12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;border-radius:4px;font-size:13px}
.btn.primary{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.btn:hover{background:var(--hover)}.btn.primary:hover{opacity:.9}
.btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,th button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px}
.chip{border:1px solid var(--line);background:var(--panel);padding:3px 10px;font-size:12px;cursor:pointer;min-height:28px;border-radius:3px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.sw{width:9px;height:9px;display:inline-block;border-radius:1px}
.thbtn{background:none;border:0;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.slider{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
input[type=range]{width:min(360px,60vw);accent-color:var(--primary)}
.bar{height:6px;background:var(--line);border-radius:1px}
.bar i{display:block;height:100%;background:var(--buy);width:0}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{padding:6px 12px;border-top:1px solid var(--line)}
ul.plain li:first-child{border-top:0}
.muted{color:var(--muted)}
.fx{padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.fx .mono{font-size:12px;color:var(--muted)}
details>summary{cursor:pointer;color:var(--muted);font-size:12px;padding:2px 0}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--primary)}
.steps label{font-weight:500;cursor:pointer}
.steps .d{color:var(--muted);font-size:13px;margin-top:2px;white-space:pre-line}
.steps li.done label{text-decoration:line-through;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--primary);color:var(--onprimary);font:12px var(--mono);padding:4px 8px;border-radius:3px;z-index:20;max-width:300px;display:none}
iframe.tv{width:100%;height:340px;border:1px solid var(--line);margin-top:8px}
svg text{font-family:var(--mono)}
footer{color:var(--muted);font-size:12px;padding:8px 0 40px}
.katex{font-size:1.05em}
@media (max-width:900px){.cells{grid-template-columns:repeat(2,1fr)}.cell{border-top:1px solid var(--line)}.cell:nth-child(odd){border-left:0}.cell:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><span class="brand">PORTFOLIO ENGINE</span><span class="asof" id="asof"></span>
<nav aria-label="Sections"><a href="#regime">Regime</a><a href="#blotter">Blotter</a><a href="#factors">Factors</a><a href="#money">Money</a><a href="#why">Inputs</a><a href="#backtest">Replay</a><a href="#evidence">10 years</a><a href="#universe">Universe</a><a href="#steps">Steps</a></nav></div></header>
<main>
<section id="regime" class="panel" aria-label="Regime and portfolio health"></section>
<section id="decision" class="panel"></section>
<section id="guards" class="panel" hidden></section>
<section id="blotter" class="panel"></section>
<section id="factors" class="panel"></section>
<section id="money" class="panel"></section>
<section id="why" class="panel"></section>
<section id="backtest" class="panel"></section>
<section id="evidence" class="panel"></section>
<section id="universe" class="panel"></section>
<section id="steps" class="panel"></section>
<footer id="foot"></footer>
</main>
<div class="tip" id="tip" role="tooltip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
/* ---------- data, with engine prose cleaned (no em-dashes in UI copy) ---------- */
const clean = o => typeof o === 'string' ? o.replace(/\s*—\s*/g, ', ') : Array.isArray(o) ? o.map(clean) : (o && typeof o === 'object') ? Object.fromEntries(Object.entries(o).map(([k,v]) => [k, clean(v)])) : o;
const D = clean(JSON.parse(document.getElementById('data').textContent));
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, ...k) => { const e = document.createElement(t); for (const [x,v] of Object.entries(a)) { if (x==='class') e.className=v; else if (x==='html') e.innerHTML=v; else if (x.startsWith('on')) e.addEventListener(x.slice(2), v); else e.setAttribute(x,v); } k.flat().forEach(c => e.append(c)); return e; };
const NS='http://www.w3.org/2000/svg';
const sv = (t, a={}, ...k) => { const e = document.createElementNS(NS, t); for (const [x,v] of Object.entries(a)) e.setAttribute(x, v); k.flat().forEach(c => e.append(c)); return e; };
const rs = x => 'Rs ' + Math.round(x).toLocaleString('en-IN');
const num = (x, d=0) => (x==null||isNaN(x)) ? '-' : x.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
const pc = (x, d=1) => (x==null||isNaN(x)) ? '-' : (x*100).toFixed(d) + '%';
const spc = (x, d=1) => (x==null||isNaN(x)) ? '-' : (x>=0?'+':'') + (x*100).toFixed(d) + '%';
const cls = x => x>0?'buy':x<0?'sell':'hold';
const panel = (id, title, hint) => { const p = $('#'+id); p.append(el('div',{class:'ph'}, el('h2',{},title), hint?el('span',{class:'hint'},hint):'')); return p; };
const SLEEVE = {india_equity:'#2563eb', global_equity:'#d97706', gold:'#ca8a04', metals:'#78716c', semis:'#0f766e', commodity:'#a16207', bonds:'#4d7c0f', cash:'#059669', other:'#64748b'};
const SLEEVE_NAME = {india_equity:'India equity', global_equity:'Global equity', gold:'Gold', metals:'Metals', semis:'Semiconductors', commodity:'Commodity', bonds:'Bonds', cash:'Cash', other:'Other'};
const PAL = ['#64748b','#2563eb','#d97706','#059669','#e11d48','#a16207','#0f766e','#c2410c','#4d7c0f','#be123c','#1d4ed8','#b45309','#475569','#15803d','#9f1239'];
const tip = $('#tip');
function showTip(e, html){ tip.innerHTML=html; tip.style.display='block'; const w=tip.offsetWidth; tip.style.left=Math.min(innerWidth-w-8,e.clientX+12)+'px'; tip.style.top=(e.clientY+14)+'px'; }
function hideTip(){ tip.style.display='none'; }
$('#asof').textContent = D.asof + '  ' + D.data_note;

/* ---------- KaTeX (optional, from a CDN; falls back to monospace text) ---------- */
const FORMULAS = {
  R:  {tex:'R = \\frac{P_{t-1}}{P_{t-12}} - 1', plain:'R = P(t-1) / P(t-12) - 1', note:'12-1 month return: price one month ago over price twelve months ago. In days: skip = 21, lookback = 252.'},
  sigma:{tex:'\\sigma = \\sqrt{\\frac{252}{N-1}\\sum_{i}(r_i-\\bar r)^2}', plain:'sigma = sqrt(252 / (N-1) * sum (r - mean r)^2)', note:'Annualised volatility of daily returns over the same window.'},
  M:  {tex:'M = \\frac{R}{\\sigma}', plain:'M = R / sigma', note:'Momentum per unit of risk.'},
  z:  {tex:'z = \\frac{M-\\mu_M}{\\sigma_M}', plain:'z = (M - mean M) / stdev M', note:'M standardised across the whole universe, so scores are comparable.'},
  regime:{tex:'\\text{regime} = \\mathbf{1}\\left[P_t > \\mathrm{SMA}_{200}\\right]', plain:'regime = 1 if P > SMA200 else 0', note:'1 = RISK_ON, 0 = CASH_PRESERVATION.'},
  rule:{tex:'\\Delta w = w^{*} - w,\\qquad \\text{trade iff } |\\Delta w| \\ge \\theta', plain:'dw = w* - w;  trade if |dw| >= theta', note:'Drift rule used by the slider. Below theta the position is held.'}
};
let katexReady = false;
function renderTex(node){ const f = FORMULAS[node.dataset.f]; if (katexReady) { try { window.katex.render(f.tex, node, {throwOnError:false, displayMode:false}); return; } catch(e){} } node.className='mono'; node.textContent = f.plain; }
function texAll(){ document.querySelectorAll('[data-f]').forEach(renderTex); }
(function(){ const l = el('link',{rel:'stylesheet',href:'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css'}); const s = el('script',{src:'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js'}); s.onload = () => { katexReady = true; texAll(); }; document.head.append(l, s); })();
const fnode = k => el('span',{'data-f':k});

/* ---------- blotter math (shared by regime bar, blotter, curve) ---------- */
const P = D.rebalance_parameters; let theta = P.theta_default;
function calcBlotter(th){
  const nav = D.nav; const rows = D.execution_blotter.map(r => {
    const cw = r.cur_value/nav, tw = r.tgt_value/nav, drift = tw - cw;
    const trade = Math.abs(drift) >= th - 1e-12 && Math.abs(drift) > 1e-9;
    const side = trade ? (drift>0?'BUY':'SELL') : 'HOLD';
    let dv = trade ? drift*nav : 0, dsh = 0;
    if (trade) { if (side==='SELL' && r.tgt_value<=1) { dsh = -r.cur_shares; dv = -r.cur_value; } else { dsh = (dv>0?1:-1)*Math.floor(Math.abs(dv)/r.price); dv = dsh*r.price; } }
    const cost = trade && dsh!==0 ? r.cost_fixed + r.cost_pct*Math.abs(dv) : 0;
    const tax = side==='SELL' ? Math.abs(dv)*r.tax_rate_on_sale : 0;
    return {...r, cw, tw, drift, side, dv, dsh, cost, tax, newSh: r.cur_shares + dsh};
  });
  const vol = rows.reduce((a,r)=>a+Math.abs(r.dv),0);
  return {rows, vol, turnover: vol/2/nav, cost: rows.reduce((a,r)=>a+r.cost,0), tax: rows.reduce((a,r)=>a+r.tax,0), n: rows.filter(r=>r.side!=='HOLD').length};
}

/* ---------- 1. regime / health bar ---------- */
const regimeCells = {};
(function(){
  const p = $('#regime'), R = D.regime_filter;
  const on = R.state==='RISK_ON';
  const grid = el('div',{class:'cells'});
  const mk = (k, label) => { const c = el('div',{class:'cell'}, el('small',{},label)); regimeCells[k] = c; grid.append(c); return c; };
  mk('regime','Regime'); mk('nav','Total value'); mk('vol','Pending trade volume'); mk('turn','Est. turnover'); mk('cost','Est. cost + tax'); mk('cash','Cash shelter');
  p.append(grid);
  regimeCells.regime.append(el('b',{class:on?'buy':'sell'}, R.state), el('div',{class:'sub'}, `${R.benchmark} ${num(R.price,2)} vs SMA200 ${num(R.sma200,2)} (${spc(R.gap)})`), el('div',{class:'sub'}, `Engine view: ${R.engine_label||'n/a'}${R.vix?`, India VIX ${R.vix.toFixed(1)}`:''}`));
  regimeCells.nav.append(el('b',{}, rs(D.nav)), el('div',{class:'sub'}, `${D.holdings.length} lot(s)${D.usd_inr?`, USD/INR ${D.usd_inr.toFixed(2)}`:''}`));
  const cw = R.target_cash_weight;
  regimeCells.cash.append(el('b',{}, cw==null?'n/a':pc(cw)), el('div',{class:'sub'}, cw==null?'policy keeps current mix':rs(cw*D.nav)+' in cash target'), el('div',{class:'sub'}, on?'regime allows risk':'trend says shelter in cash'));
})();
function updateRegimeBar(){
  const c = calcBlotter(theta);
  const set = (k, main, sub) => { const cell = regimeCells[k]; cell.querySelectorAll('b,.sub').forEach(x=>x.remove()); cell.append(el('b',{},main), el('div',{class:'sub'},sub)); };
  set('vol', rs(c.vol), `${c.n} order(s) at theta ${pc(theta)}`); set('turn', pc(c.turnover,1), 'one-way, share of portfolio'); set('cost', rs(c.cost + c.tax), `fees ${rs(c.cost)}, tax est. ${rs(c.tax)}`);
}

/* ---------- 2. decision (one answer first) ---------- */
(function(){
  const v = D.verdict, p = panel('decision','Decision');
  p.append(el('div',{class:'pb'}, el('span',{class:'tag '+(v.call==='REBALANCE'?'buy':'hold')}, v.call==='HOLD'?'DO NOT REBALANCE':'REBALANCE'), ' ', el('b',{}, v.headline)));
  p.append(el('ul',{class:'plain'}, v.reasons.map(r=>el('li',{},r))), el('div',{class:'fx muted'}, `Strategy: ${D.policy}. Decision support only, not investment or tax advice. You make the final call.`));
})();

/* ---------- guardrails ---------- */
(function(){
  if(!D.guardrails.length) return; const p=$('#guards'); p.hidden=false; panel('guards','Your limits','checked across everything you own');
  p.append(el('ul',{class:'plain'}, D.guardrails.map(g=>el('li',{}, el('span',{class:'tag '+(g.level==='warn'?'warn':'hold')}, g.level==='warn'?'CHECK':g.level==='ok'?'OK':'TIP'), ' ', el('b',{},g.title), ' ', el('span',{class:'muted'},g.detail)))));
})();

/* ---------- 3. order blotter with theta slider ---------- */
function miniChart(host, xs, ys, mark, fmt, label){
  const W=Math.max(host.clientWidth,260), H=120, m={l:46,r:8,t:8,b:20}; host.innerHTML='';
  const lo=0, hi=Math.max(...ys)*1.1||1; const X=i=>m.l+(W-m.l-m.r)*(xs[i]-xs[0])/(xs[xs.length-1]-xs[0]), Y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img','aria-label':label});
  [0,.5,1].forEach(k=>{ const v=lo+(hi-lo)*k, y=Y(v); svg.append(sv('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:'var(--line)'})); const t=sv('text',{x:m.l-4,y:y+3,'text-anchor':'end','font-size':10,fill:'var(--muted)'}); t.textContent=fmt(v); svg.append(t); });
  [0.005,0.015,0.03,0.05].forEach(v=>{ const x=m.l+(W-m.l-m.r)*(v-xs[0])/(xs[xs.length-1]-xs[0]); const t=sv('text',{x,y:H-6,'text-anchor':'middle','font-size':10,fill:'var(--muted)'}); t.textContent=(v*100).toFixed(1)+'%'; svg.append(t); });
  svg.append(sv('path',{d:ys.map((y,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(y).toFixed(1)).join(''),fill:'none',stroke:'var(--ink)','stroke-width':1.5}));
  const mx = m.l+(W-m.l-m.r)*(mark.x-xs[0])/(xs[xs.length-1]-xs[0]);
  svg.append(sv('line',{x1:mx,x2:mx,y1:m.t,y2:H-m.b,stroke:'var(--sell)','stroke-dasharray':'3 3'}), sv('rect',{x:mx-3,y:Y(mark.y)-3,width:6,height:6,fill:'var(--sell)'}));
  host.append(svg);
}
(function(){
  const p = panel('blotter','Order blotter','drift rule: trade only if |target weight - current weight| is at least theta');
  const sl = el('div',{class:'slider'});
  const inp = el('input',{type:'range',min:P.theta_min*1000,max:P.theta_max*1000,step:'1',value:Math.round(theta*1000),'aria-label':'Rebalance threshold theta'});
  const out = el('span',{class:'mono'}); sl.append(el('label',{for:'th'},'Threshold '), fnode('rule'), inp, out, el('button',{class:'btn',type:'button',onclick:()=>{ inp.value=Math.round(P.theta_default*1000); inp.dispatchEvent(new Event('input')); }},'Reset to '+pc(P.theta_default)));
  inp.id='th'; p.append(sl);
  const body = el('div',{class:'scroll'}); p.append(body);
  const sum = el('div',{class:'fx'}); p.append(sum);
  const charts = el('div',{style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));border-top:1px solid var(--line)'}, el('div',{class:'fx',style:'border:0'}, el('div',{class:'muted'},'Turnover vs theta'), el('div',{id:'ch1'})), el('div',{class:'fx',style:'border:0;border-left:1px solid var(--line)'}, el('div',{class:'muted'},'Fees + estimated tax vs theta (Rs)'), el('div',{id:'ch2'})));
  p.append(charts);
  p.append(el('div',{class:'fx muted'}, 'The slider shows what a plain drift rule would do. The tax-aware engine column is the plan the checklist follows: it also weighs tax, signal strength and costs. Tax is estimated as gain share times rate and ignores the Rs 1.25 lakh yearly exemption and loss set-off, so the engine\'s figure can be lower.'));
  function draw(){
    out.textContent = pc(theta, 1); const c = calcBlotter(theta);
    body.innerHTML=''; body.append(el('table',{}, el('thead',{}, el('tr',{}, ['Ticker','Action','Shares now','Shares after','Weight now','Weight target','Drift','Value change','Est. cost','Est. tax','Engine'].map(h=>el('th',{},h)))),
      el('tbody',{}, c.rows.map(r=>el('tr',{}, el('td',{}, el('b',{},r.symbol)), el('td',{}, el('span',{class:'tag '+(r.side==='BUY'?'buy':r.side==='SELL'?'sell':'hold')}, r.side)), el('td',{class:'n'},num(r.cur_shares,r.symbol==='CASH'?2:r.cur_shares%1?2:0)), el('td',{class:'n '+cls(r.dsh)}, num(r.newSh, r.newSh%1?2:0)),
        el('td',{class:'n'},pc(r.cw)), el('td',{class:'n'},pc(r.tw)), el('td',{class:'n '+cls(r.drift)}, spc(r.drift,2)), el('td',{class:'n '+cls(r.dv)}, r.dv?((r.dv>0?'+':'-')+rs(Math.abs(r.dv))):'-'), el('td',{class:'n'}, r.cost?rs(r.cost):'-'), el('td',{class:'n'}, r.tax?rs(r.tax):'-'),
        el('td',{}, r.engine?el('span',{class:'tag '+(r.engine==='BUY'?'buy':'sell')}, r.engine):el('span',{class:'hold'},'-'))))),
      el('tfoot',{}, el('tr',{style:'font-weight:500'}, el('td',{}, 'Total'), el('td',{}, c.n+' orders'), el('td',{colspan:'5'}, ''), el('td',{class:'n'}, rs(c.vol)), el('td',{class:'n'}, rs(c.cost)), el('td',{class:'n'}, rs(c.tax)), el('td',{}, '')))));
    sum.textContent = `At theta ${pc(theta)}: ${c.n} order(s), turnover ${pc(c.turnover)}, fees ${rs(c.cost)}, estimated tax ${rs(c.tax)} (${pc((c.cost+c.tax)/D.nav,2)} of portfolio). Wider theta means fewer, larger-drift trades.`;
